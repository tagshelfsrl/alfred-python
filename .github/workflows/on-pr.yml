name: On PR

on:
  pull_request:
    branches:
      - master
      - development

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: tagshelfsrl/action-semantic-pull-request@main
        with:
          types: |
            chore
            docs
            fix
            feat
            misc
            test
            release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout alfred-python
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Build package
        run: make test && make build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alfred-python
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit pinned requirements
        run: |
          python -m pip install pip-audit==2.10.1
          # Audit every pin, whatever platform it is for: with its environment
          # marker, the Windows-only python-magic-bin would be skipped here.
          sed -E 's/[[:space:]]*;.*$//' requirements.txt > "$RUNNER_TEMP/audit-requirements.txt"
          pip-audit -r "$RUNNER_TEMP/audit-requirements.txt" --no-deps --disable-pip
